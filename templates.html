  <body>
    <script>
      /* تطبيق الثيم واللغة المحفوظين قبل أول رسم لمنع الوميض */
      (function () {
        try {
          var t = localStorage.getItem('theme'), l = localStorage.getItem('lang');
          if (t === 'light') document.body.classList.add('light-mode');
          if (l === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
            document.body.dir = 'ltr';
          }
        } catch (e) {}
      })();
    </script>
    <nav id="navbar">

      </a>
      <div style="display: flex; align-items: center; gap: 10px">
        <button class="lang-toggle" onclick="toggleLang()">
          <span class="lang-text lang-ar">عربي</span>
          <span class="lang-sep">|</span>
          <span class="lang-text lang-en">EN</span>
        </button>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
          <span class="theme-icon"></span>
        </button>

        </div>
      </section>

      <div class="tpl-grid" id="templatesGrid"></div>

      <div style="margin-top: 40px; text-align: center;">
        <a href="index.html#templates" class="btn-primary" data-translate="back_home">العودة إلى الرئيسية</a>
      </div>
    </main>

    <script src="templates-data.js"></script>
